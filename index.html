<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>To-dos with Elias</title>
  <meta name="description" content="Shared to-do lists with priorities and categories.">
  <meta name="theme-color" content="#257a70">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></span>
        <div>
          <div class="brand-name">To-dos with Elias</div>
          <div class="brand-sub" id="brandSub">Shared to-do lists</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="todos"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11"/><circle cx="5" cy="18" r="1.2"/></svg></span><span>To-dos</span></button>
        <button class="nav-item" data-view="categories"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></span><span>Categories</span></button>
        <button class="nav-item" data-view="done"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg></span><span>Done</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg></span><span>Settings</span></button>
      </nav>
      <div class="sidebar-actions">
        <button class="btn btn-primary block" data-action="add-full">New to-do</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-row">
          <h1 class="view-title" id="viewTitle">To-dos</h1>
          <button class="sync-badge" id="syncBadge" data-action="goto" data-view="settings"></button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <button class="fab" data-action="add-full" aria-label="New to-do"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

  <dialog id="modal" class="modal">
    <div class="modal-inner" id="modalBody"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastAction" class="toast-action" hidden></button></div>

  <script src="app.js"></script>
  <script type="module" src="sync.js"></script>
</body>
</html>
